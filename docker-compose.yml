services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: student_schedule
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d student_schedule']
      interval: 2s
      timeout: 2s
      retries: 15

  migrate:
    build:
      context: .
      target: migrator
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/student_schedule?schema=public
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      target: api
    environment:
      PORT: 8343
      DATABASE_URL: postgresql://postgres:postgres@db:5432/student_schedule?schema=public
      LOG_LEVEL: log
    ports:
      - '8343:8343'
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        ['CMD', 'wget', '--spider', '--quiet', 'http://127.0.0.1:8343/healthz']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
